name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # x.yy.zzz (versions.json, scripts/version.mjs): yy counts days with changes, zzz is this run.
  version:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.v.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: v
        run: echo "app=$(node scripts/version.mjs app)" >> "$GITHUB_OUTPUT"
      - run: |
          echo "Version: ${{ steps.v.outputs.app }}" >> "$GITHUB_STEP_SUMMARY"

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install -e "backend[test]"
      - run: python -m pytest -q
        working-directory: backend

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build

  image:
    needs: [version, test, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      # Smoke test: build for amd64, start it next to a database and wait for "healthy".
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: finanzen:smoke
          build-args: APP_VERSION=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker network create smoke
          docker run -d --name db --network smoke -e POSTGRES_USER=finanzen -e POSTGRES_PASSWORD=smoke -e POSTGRES_DB=finanzen postgres:17-alpine
          for i in $(seq 1 30); do docker exec db pg_isready -U finanzen -d finanzen && break; sleep 2; done
          docker run -d --name app --network smoke -p 43651:43651 \
            -e DATABASE_URL=postgresql://finanzen:smoke@db:5432/finanzen finanzen:smoke
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' app)
            [ "$status" = healthy ] && break
            sleep 2
          done
          body=$(curl -fsS http://127.0.0.1:43651/healthz)
          echo "$body"
          echo "$body" | grep -q "\"version\":\"$VERSION\""
          [ "$(docker inspect -f '{{.State.Health.Status}}' app)" = healthy ]
      - name: Logs on failure
        if: failure()
        run: docker logs app || true

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/finanzen
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ env.VERSION }}
            type=sha
      - if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ env.VERSION }}
          cache-from: type=gha
      - if: github.event_name != 'pull_request'
        run: |
          echo "Image: ghcr.io/${{ github.repository_owner }}/finanzen:${{ env.VERSION }}" >> "$GITHUB_STEP_SUMMARY"
