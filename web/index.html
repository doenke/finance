<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#14532d">
  <title>finance</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    :root { --bg: #f6f7f4; --fg: #1c1f1a; --muted: #5d6459; --card: #ffffff; --ok: #15803d; --err: #b91c1c; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121512; --fg: #e8ece6; --muted: #9aa396; --card: #1c211c; --ok: #4ade80; --err: #f87171; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px;
           background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 26rem; width: 100%; background: var(--card); border-radius: 20px; padding: 32px 24px;
           text-align: center; box-shadow: 0 1px 3px rgb(0 0 0 / .08); }
    img { width: 96px; height: 96px; }
    h1 { margin: 12px 0 4px; font-size: 1.6rem; }
    p { margin: 8px 0; color: var(--muted); }
    #status { font-variant-numeric: tabular-nums; }
    .ok { color: var(--ok); } .err { color: var(--err); }
  </style>
</head>
<body>
  <main>
    <img src="icon.svg" alt="">
    <h1>finance</h1>
    <p>Hier entsteht der Finanzüberblick für unseren Haushalt.</p>
    <p id="status">Prüfe den Server …</p>
  </main>
  <script>
    // Placeholder: show version and health so the deployment can be verified.
    const el = document.getElementById('status');
    fetch('healthz', { cache: 'no-store' })
      .then((r) => r.json())
      .then((h) => {
        const parts = Object.entries(h.checks || {}).map(([k, v]) => `${k === 'db' ? 'Datenbank' : 'Datenverzeichnis'}: ${v === 'ok' ? 'ok' : 'Fehler'}`);
        el.className = h.status === 'ok' ? 'ok' : 'err';
        el.textContent = `Version ${h.version} · ${parts.join(' · ')}`;
      })
      .catch(() => { el.className = 'err'; el.textContent = 'Server nicht erreichbar'; });
  </script>
</body>
</html>
